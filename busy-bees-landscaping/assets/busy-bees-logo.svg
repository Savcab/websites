<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Busy Bees Lawncare logo">
  <!-- honeycomb-rounded badge -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="#1f7a4d"/>
  <!-- grass swoosh -->
  <path d="M20 66 Q48 56 76 66" fill="none" stroke="#8bc34a" stroke-width="5" stroke-linecap="round"/>
  <!-- bee body -->
  <ellipse cx="48" cy="44" rx="14" ry="17" fill="#f5b921"/>
  <!-- bee stripes -->
  <path d="M36 40 H60 M35 48 H61 M38 56 H58" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="48" cy="26" r="6.5" fill="#1a1a1a"/>
  <!-- antennae -->
  <path d="M45 21 Q41 14 44 12 M51 21 Q55 14 52 12" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- wings -->
  <ellipse cx="33" cy="36" rx="9" ry="6" fill="#ffffff" opacity="0.92" transform="rotate(-24 33 36)"/>
  <ellipse cx="63" cy="36" rx="9" ry="6" fill="#ffffff" opacity="0.92" transform="rotate(24 63 36)"/>
</svg>
